    </g>
  </g>

  <!-- Yellow center -->
  <circle cx="500" cy="500" r="300" fill="#FCCD30"/>

  <!-- Atom -->
  <g fill="none" stroke="#111111" stroke-width="25" stroke-linecap="round">
    <ellipse cx="500" cy="500" rx="235" ry="105"/>
    <ellipse cx="500" cy="500" rx="235" ry="105" transform="rotate(60 500 500)"/>
    <ellipse cx="500" cy="500" rx="235" ry="105" transform="rotate(120 500 500)"/>
  </g>
  <circle cx="500" cy="500" r="42" fill="#111111"/>
</svg>
